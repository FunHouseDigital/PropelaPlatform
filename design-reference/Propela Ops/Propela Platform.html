<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Propela Health — Platform UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: #1a1225; }
    select, input, textarea, button { font-family: 'Poppins', sans-serif; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Starter components -->
  <script type="text/babel" src="components/design-canvas.jsx"></script>
  <script type="text/babel" src="components/ios-frame.jsx"></script>
  <script type="text/babel" src="components/tweaks-panel.jsx"></script>

  <!-- Screen components -->
  <script type="text/babel" src="components/signup-form.jsx"></script>
  <script type="text/babel" src="components/nurse-dashboard.jsx"></script>
  <script type="text/babel" src="components/admin-dashboard.jsx"></script>

  <!-- App assembly -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentColor": "#5B2D8E",
      "formRadius": "rounded",
      "dashboardDensity": "compact"
    }/*EDITMODE-END*/;

    function App() {
      const tweaks = typeof useTweaks === 'function' ? useTweaks(TWEAK_DEFAULTS) : [TWEAK_DEFAULTS, () => {}];
      const [t, setTweak] = tweaks;

      return (
        <React.Fragment>
          <DesignCanvas>
            <DCSection id="mobile" title="Nurse Experience — Mobile">
              <DCArtboard id="signup" label="Sign-up Form (Step 3: Experience)" width={402} height={874}>
                <IOSDevice width={402} height={874}>
                  <div className="sf-screen" style={{ height: '100%' }}>
                    <SignupForm />
                  </div>
                </IOSDevice>
              </DCArtboard>

              <DCArtboard id="dashboard" label="Candidate Dashboard" width={402} height={874}>
                <IOSDevice width={402} height={874}>
                  <NurseDashboard />
                </IOSDevice>
              </DCArtboard>
            </DCSection>

            <DCSection id="admin" title="Admin Experience — Desktop (Aya's View)">
              <DCArtboard id="admin-dash" label="Cohort 1 — Candidate Pipeline" width={1400} height={820}>
                <AdminDashboard />
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel title="Propela Platform">
            <TweakSection label="Brand">
              <TweakColor label="Primary accent" value={t.accentColor}
                options={['#5B2D8E', '#3D1D5E', '#7B4BAE']}
                onChange={v => setTweak('accentColor', v)} />
            </TweakSection>
            <TweakSection label="Form Style">
              <TweakRadio label="Border radius" value={t.formRadius}
                options={['rounded', 'pill', 'sharp']}
                onChange={v => setTweak('formRadius', v)} />
            </TweakSection>
            <TweakSection label="Dashboard">
              <TweakRadio label="Card density" value={t.dashboardDensity}
                options={['comfortable', 'compact']}
                onChange={v => setTweak('dashboardDensity', v)} />
            </TweakSection>
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
