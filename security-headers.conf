# =============================================================================
# Security headers + Content-Security-Policy — SINGLE SOURCE OF TRUTH.
# =============================================================================
#
# This file is `include`d by nginx.conf into the server scope AND into every
# location block that declares its own `add_header` (the /assets/, =/index.html
# and =/sw.js cache blocks).
#
# WHY THE DUPLICATION-VIA-INCLUDE: nginx's `add_header` is NOT additive across
# context levels — as soon as a `location` block contains *any* `add_header`,
# it stops inheriting the server-level `add_header` directives. The cache
# blocks each set `Cache-Control`, so without re-including this file they would
# silently serve responses with NO security headers. Including this one file in
# each such block keeps the policy defined exactly once while satisfying that
# nginx rule. Locations with no `add_header` of their own (e.g. the SPA
# fallback `location /`) inherit these from the server scope automatically.
#
# Deployment notes (see DEPLOYMENT.md "Security headers / CSP" section):
#   * In the Docker image this file lives at /etc/nginx/security-headers.conf
#     (copied by the Dockerfile / bind-mounted by docker-compose). It is kept
#     OUTSIDE /etc/nginx/conf.d/ on purpose so nginx's default
#     `include /etc/nginx/conf.d/*.conf;` does not try to load it as a
#     standalone server block.
#   * The CSP `connect-src`, and the API/Sentry origins in particular, are
#     environment-specific in this static build. Replace the placeholder
#     origins below before shipping (instructions in DEPLOYMENT.md).
# -----------------------------------------------------------------------------

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable powerful browser features the app does not use.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

# HSTS. Only has any effect when the response is delivered over HTTPS; this
# nginx listens on :80 behind a TLS-terminating load balancer (see
# DEPLOYMENT.md), which forwards the header to the client over the HTTPS edge.
# Harmless when accessed over plain HTTP (e.g. local Docker). `preload` is
# intentionally omitted — only add it once you are ready for the commitment.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy. Kept on a single line because nginx `add_header`
# values cannot span multiple lines. Directive-by-directive rationale:
#   default-src 'self'      — deny-by-default for anything not listed below.
#   script-src  'self'      — STRICT. The production build emits no inline
#                             <script> (the runtime is an external chunk), so
#                             no 'unsafe-inline'/'unsafe-eval' is needed. DO NOT
#                             add them as a shortcut.
#   style-src   'self' 'unsafe-inline' https://fonts.googleapis.com
#                           — 'unsafe-inline' is REQUIRED: recharts injects
#                             inline style="" attributes at runtime and
#                             Tailwind/React rely on inline styles. The Google
#                             Fonts origin serves the Poppins stylesheet that
#                             index.html links.
#   font-src    'self' https://fonts.gstatic.com
#                           — the Poppins woff2 files are served from gstatic.
#   img-src     'self' data: — blanket `https:` removed; `data:` retained for
#                             Vite-inlined small assets (<4kb) and inline SVGs.
#   connect-src — 'self', explicit API/Sentry placeholders, Supabase HTTPS +
#                 realtime WSS origins, and the Google Fonts origins. The
#                 service worker (public/sw.js) re-fetches the font stylesheet/
#                 files via fetch() for its stale-while-revalidate cache, and SW
#                 fetch() is governed by connect-src — so the font origins must
#                 appear here too. Supabase uses project subdomains; limiting
#                 the wildcard to *.supabase.co avoids a blanket scheme source.
#                 >>> Replace the api./sentry. placeholders per environment. <<<
#   worker-src  'self'      — the PWA service worker (/sw.js).
#   frame-ancestors 'self'  — clickjacking defence (modern X-Frame-Options).
#   base-uri 'self'         — block <base> tag injection.
#   form-action 'self'      — restrict form submission targets.
#   object-src 'none'       — no plugins/embeds.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.example.com https://sentry.example.com https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
