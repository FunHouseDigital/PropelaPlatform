server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers + Content-Security-Policy.
    # Defined once in security-headers.conf and included everywhere it is
    # needed. See that file for the nginx add_header inheritance gotcha and the
    # per-environment connect-src guidance. Applies to the server scope and is
    # inherited by any location WITHOUT its own add_header (e.g. the SPA
    # fallback `location /` below).
    include /etc/nginx/security-headers.conf;

    # Cache hashed assets (immutable).
    # This block sets its own add_header (Cache-Control), so nginx stops
    # inheriting the server-scope security headers here — re-include them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # No cache for index.html (re-include security headers — see above).
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
    }

    # No cache for the service worker (re-include security headers — see above).
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
    }

    # SPA fallback routing. No add_header here, so the server-scope security
    # headers above are inherited automatically.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
